name: Tests

on:
  push:
  pull_request:

jobs:
  xcodebuild-test:
    # Same reason as the concurrency job: the project needs Swift 6.2
    # (Xcode 26) to compile at all.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        # The image's default is not always its newest, and which versions it
        # carries changes without notice. Pick the highest by version rather
        # than naming one, and print the list so a future failure says what was
        # actually there to choose from.
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          newest="${newest:-/Applications/Xcode.app}"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Run the test suite
        # StampoTests is a *hosted* bundle (TEST_HOST = Stampo.app), so the app
        # has to launch for a single test to run. On the arm64 runners an
        # unsigned bundle will not launch at all, so the signature is ad-hoc
        # rather than switched off: no team, no provisioning, but a signature.
        #
        # Parallel testing is disabled deliberately — with it enabled the run
        # hangs on "waiting for workers to materialize" in this project's
        # environment, and the whole suite finishes in seconds without it.
        run: bash Scripts/run-tests.sh
