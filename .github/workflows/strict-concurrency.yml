name: Strict concurrency

on:
  push:
  pull_request:
  # Asked for by hand, on any branch. Added the day GitHub Actions dropped a
  # merge's push event during an outage: the suite had been green on the pull
  # request, the tree on main was byte for byte the same, and there was still
  # no way to ask main itself for the run a release waits on.
  workflow_dispatch:

jobs:
  swift-strict-concurrency:
    # The project needs Swift 6.2 (Xcode 26) to compile at all — `isolated
    # deinit` is a hard error before it. macos-15 ships Xcode 16 as its default
    # and the job failed on the language, never reaching the check it is for.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        # The image's default is not always its newest, and which versions it
        # carries changes without notice. Pick the highest by version rather
        # than naming one, and print the list so a future failure says what was
        # actually there to choose from.
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          newest="${newest:-/Applications/Xcode.app}"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Build with complete Swift concurrency checking
        run: bash Scripts/check-strict-concurrency.sh
